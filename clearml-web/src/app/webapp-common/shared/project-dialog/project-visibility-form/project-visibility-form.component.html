<div class="project-visibility">
  <div class="body">
    <div class="mb-2">Choose visibility for <b>{{ baseProject?.name }}</b>:</div>

    <mat-radio-group [(ngModel)]="visibility" name="projectVisibility">
      <mat-radio-button [value]="'private'">Private</mat-radio-button>
      <mat-radio-button [value]="'public'">Public</mat-radio-button>
    </mat-radio-group>
  </div>

  <div class="actions">
    <button mat-stroked-button type="button" (click)="cancel()">CANCEL</button>
    <button mat-flat-button color="primary" type="button" (click)="submit()">SAVE</button>
  </div>
</div>
